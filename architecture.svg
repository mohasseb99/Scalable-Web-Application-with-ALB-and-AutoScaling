<svg viewBox="0 0 1280 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1280" height="900" fill="#ffffff"/>
  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Scalable Web Application with ALB and Auto Scaling (EC2-based, 2 AZs)</text>

  <!-- Edge -->
  <rect x="20" y="60" width="1240" height="150" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="34" y="80" font-size="13" font-weight="bold" fill="#6b7280">EDGE / GLOBAL</text>

  <rect x="40" y="105" width="110" height="70" rx="8" fill="#e5e7eb" stroke="#374151"/>
  <text x="95" y="135" text-anchor="middle" font-size="14" font-weight="bold">Users</text>
  <text x="95" y="153" text-anchor="middle" font-size="11">Browser / mobile</text>

  <rect x="230" y="105" width="150" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="305" y="132" text-anchor="middle" font-size="14" font-weight="bold">Route 53</text>
  <text x="305" y="150" text-anchor="middle" font-size="11">Alias record to CloudFront</text>
  <text x="305" y="165" text-anchor="middle" font-size="11">+ health check on ALB</text>

  <rect x="470" y="95" width="210" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="575" y="122" text-anchor="middle" font-size="14" font-weight="bold">Amazon CloudFront</text>
  <text x="575" y="142" text-anchor="middle" font-size="11">HTTPS, /static/* cached at edge</text>
  <text x="575" y="158" text-anchor="middle" font-size="11">Dynamic content: pass-through</text>
  <text x="575" y="174" text-anchor="middle" font-size="11">Adds X-Origin-Verify header</text>

  <rect x="790" y="105" width="190" height="70" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="885" y="135" text-anchor="middle" font-size="14" font-weight="bold">Internet Gateway</text>
  <text x="885" y="155" text-anchor="middle" font-size="11">VPC entry point</text>

  <rect x="1050" y="95" width="195" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1147" y="120" text-anchor="middle" font-size="14" font-weight="bold">AWS WAF (Web ACL)</text>
  <text x="1147" y="138" text-anchor="middle" font-size="11">OWASP managed rules, SQLi,</text>
  <text x="1147" y="152" text-anchor="middle" font-size="11">IP reputation, rate limit</text>
  <text x="1147" y="170" text-anchor="middle" font-size="11" font-weight="bold">Attached to the ALB</text>

  <line x1="150" y1="140" x2="228" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="140" x2="468" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="680" y1="140" x2="788" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="734" y="132" text-anchor="middle" font-size="10" fill="#374151">HTTP:80</text>
  <text x="734" y="158" text-anchor="middle" font-size="10" fill="#374151">+ secret header</text>

  <!-- VPC -->
  <rect x="20" y="230" width="1060" height="640" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="2.5"/>
  <text x="34" y="252" font-size="14" font-weight="bold" fill="#0369a1">VPC 10.0.0.0/16</text>

  <!-- AZ A -->
  <rect x="40" y="270" width="500" height="580" rx="8" fill="none" stroke="#0369a1" stroke-dasharray="8 5"/>
  <text x="290" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">Availability Zone A</text>
  <!-- AZ B -->
  <rect x="560" y="270" width="500" height="580" rx="8" fill="none" stroke="#0369a1" stroke-dasharray="8 5"/>
  <text x="810" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">Availability Zone B</text>

  <!-- Public subnets -->
  <rect x="55" y="305" width="470" height="150" rx="6" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="65" y="323" font-size="12" font-weight="bold" fill="#15803d">Public subnet A 10.0.1.0/24</text>
  <rect x="575" y="305" width="470" height="150" rx="6" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="585" y="323" font-size="12" font-weight="bold" fill="#15803d">Public subnet B 10.0.2.0/24</text>

  <rect x="75" y="345" width="190" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="378" text-anchor="middle" font-size="13" font-weight="bold">ALB node</text>
  <text x="170" y="396" text-anchor="middle" font-size="11">Listener :80, header rule</text>
  <text x="170" y="412" text-anchor="middle" font-size="11">SG: HTTP from internet</text>
  <rect x="595" y="345" width="190" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="690" y="378" text-anchor="middle" font-size="13" font-weight="bold">ALB node</text>
  <text x="690" y="396" text-anchor="middle" font-size="11">Application Load Balancer</text>
  <text x="690" y="412" text-anchor="middle" font-size="11">(spans both AZs)</text>

  <rect x="340" y="350" width="160" height="80" rx="6" fill="#e5e7eb" stroke="#374151"/>
  <text x="420" y="385" text-anchor="middle" font-size="13" font-weight="bold">NAT Gateway A</text>
  <text x="420" y="403" text-anchor="middle" font-size="11">+ Elastic IP</text>
  <rect x="860" y="350" width="160" height="80" rx="6" fill="#e5e7eb" stroke="#374151"/>
  <text x="940" y="385" text-anchor="middle" font-size="13" font-weight="bold">NAT Gateway B</text>
  <text x="940" y="403" text-anchor="middle" font-size="11">+ Elastic IP</text>

  <!-- App subnets -->
  <rect x="55" y="500" width="470" height="170" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="65" y="518" font-size="12" font-weight="bold" fill="#c2410c">Private app subnet A 10.0.11.0/24</text>
  <rect x="575" y="500" width="470" height="170" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="585" y="518" font-size="12" font-weight="bold" fill="#c2410c">Private app subnet B 10.0.12.0/24</text>

  <rect x="75" y="540" width="200" height="110" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="175" y="570" text-anchor="middle" font-size="13" font-weight="bold">EC2 (Amazon Linux 2023)</text>
  <text x="175" y="588" text-anchor="middle" font-size="11">Apache + PHP, IMDSv2</text>
  <text x="175" y="604" text-anchor="middle" font-size="11">SG: HTTP from ALB SG only</text>
  <text x="175" y="620" text-anchor="middle" font-size="11">No SSH, no public IP</text>
  <rect x="295" y="540" width="215" height="110" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="402" y="580" text-anchor="middle" font-size="13" font-weight="bold">EC2 (scale-out)</text>
  <text x="402" y="598" text-anchor="middle" font-size="11">Added by ASG policies</text>
  <rect x="595" y="540" width="200" height="110" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="695" y="570" text-anchor="middle" font-size="13" font-weight="bold">EC2 (Amazon Linux 2023)</text>
  <text x="695" y="588" text-anchor="middle" font-size="11">Apache + PHP, IMDSv2</text>
  <text x="695" y="604" text-anchor="middle" font-size="11">SG: HTTP from ALB SG only</text>
  <text x="695" y="620" text-anchor="middle" font-size="11">No SSH, no public IP</text>
  <rect x="815" y="540" width="215" height="110" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="922" y="580" text-anchor="middle" font-size="13" font-weight="bold">EC2 (scale-out)</text>
  <text x="922" y="598" text-anchor="middle" font-size="11">Added by ASG policies</text>

  <!-- DB subnets -->
  <rect x="55" y="705" width="470" height="125" rx="6" fill="#faf5ff" stroke="#9333ea"/>
  <text x="65" y="723" font-size="12" font-weight="bold" fill="#7e22ce">Private DB subnet A 10.0.21.0/24 (no internet route)</text>
  <rect x="575" y="705" width="470" height="125" rx="6" fill="#faf5ff" stroke="#9333ea"/>
  <text x="585" y="723" font-size="12" font-weight="bold" fill="#7e22ce">Private DB subnet B 10.0.22.0/24 (no internet route)</text>

  <rect x="150" y="740" width="320" height="75" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="310" y="768" text-anchor="middle" font-size="13" font-weight="bold">RDS MySQL - Primary</text>
  <text x="310" y="786" text-anchor="middle" font-size="11">Encrypted, automated backups</text>
  <text x="310" y="802" text-anchor="middle" font-size="11">SG: 3306 from app SG only</text>
  <rect x="670" y="740" width="320" height="75" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="830" y="768" text-anchor="middle" font-size="13" font-weight="bold">RDS MySQL - Standby</text>
  <text x="830" y="786" text-anchor="middle" font-size="11">Automatic failover (Multi-AZ)</text>
  <line x1="472" y1="778" x2="668" y2="778" stroke="#9333ea" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="570" y="770" text-anchor="middle" font-size="10" fill="#7e22ce">sync replication</text>

  <!-- Flow arrows inside VPC -->
  <line x1="885" y1="175" x2="885" y2="299" stroke="#374151" stroke-width="2"/>
  <path d="M885,299 L770,299 L770,343" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M770,299 L255,299 L255,343" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="900" y="250" font-size="10" fill="#374151">Public traffic enters the VPC</text>

  <line x1="170" y1="435" x2="170" y2="538" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="178" y="490" font-size="10" fill="#2563eb">Target group :80</text>
  <line x1="690" y1="435" x2="690" y2="538" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="698" y="490" font-size="10" fill="#2563eb">Target group :80</text>
  <line x1="240" y1="435" x2="660" y2="538" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="620" y1="435" x2="200" y2="538" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <line x1="175" y1="650" x2="260" y2="738" stroke="#9333ea" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="695" y1="650" x2="330" y2="738" stroke="#9333ea" stroke-width="2" marker-end="url(#arr)"/>
  <text x="140" y="700" font-size="10" fill="#7e22ce">MySQL :3306</text>

  <!-- NAT outbound -->
  <path d="M300,590 L318,590 L318,380 L338,380" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="326" y="470" font-size="9" fill="#6b7280" transform="rotate(-90 326 470)">outbound updates</text>

  <!-- Right sidebar: management -->
  <rect x="1100" y="230" width="160" height="640" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1180" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">OPERATIONS</text>

  <rect x="1112" y="320" width="136" height="95" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="1180" y="345" text-anchor="middle" font-size="12" font-weight="bold">Systems Manager</text>
  <text x="1180" y="362" text-anchor="middle" font-size="10">Session Manager:</text>
  <text x="1180" y="376" text-anchor="middle" font-size="10">bastion-free shell,</text>
  <text x="1180" y="390" text-anchor="middle" font-size="10">no port 22 open</text>

  <rect x="1112" y="440" width="136" height="95" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="1180" y="465" text-anchor="middle" font-size="12" font-weight="bold">CloudWatch</text>
  <text x="1180" y="482" text-anchor="middle" font-size="10">Dashboard, alarms,</text>
  <text x="1180" y="496" text-anchor="middle" font-size="10">ASG step scaling,</text>
  <text x="1180" y="510" text-anchor="middle" font-size="10">WAF + ALB metrics</text>

  <rect x="1112" y="560" width="136" height="70" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="1180" y="587" text-anchor="middle" font-size="12" font-weight="bold">Amazon SNS</text>
  <text x="1180" y="604" text-anchor="middle" font-size="10">Email notifications</text>
  <text x="1180" y="618" text-anchor="middle" font-size="10">for alarms + scaling</text>

  <rect x="1112" y="655" width="136" height="70" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="1180" y="682" text-anchor="middle" font-size="12" font-weight="bold">Secrets Manager</text>
  <text x="1180" y="699" text-anchor="middle" font-size="10">Managed RDS master</text>
  <text x="1180" y="713" text-anchor="middle" font-size="10">password</text>

  <rect x="1112" y="750" width="136" height="95" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="1180" y="775" text-anchor="middle" font-size="12" font-weight="bold">Auto Scaling Group</text>
  <text x="1180" y="792" text-anchor="middle" font-size="10">min 2 / max 6</text>
  <text x="1180" y="806" text-anchor="middle" font-size="10">Launch Template,</text>
  <text x="1180" y="820" text-anchor="middle" font-size="10">target tracking + step</text>

  <rect x="1112" y="268" width="136" height="34" rx="6" fill="#e5e7eb" stroke="#374151"/>
  <text x="1180" y="289" text-anchor="middle" font-size="11" font-weight="bold">Admin (IAM user)</text>
  <line x1="1180" y1="302" x2="1180" y2="318" stroke="#d97706" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- WAF association (drawn last so it sits above the VPC background) -->
  <path d="M1070,185 L1070,333 L800,333 L800,380 L787,380" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="940" y="327" font-size="10" fill="#dc2626">WAF inspects ALB traffic</text>

  <!-- Legend -->
  <text x="640" y="890" text-anchor="middle" font-size="11" fill="#6b7280">Solid arrows: request path. Dashed arrows: cross-AZ load balancing / outbound-only traffic via NAT. Dashed boxes: capacity added on demand or standby.</text>
</svg>
